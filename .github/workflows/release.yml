name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: go test -v ./...
      - name: Activation request SDK tag matches release tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          TAG="${TAG//$'\r'/}"
          GOT=$(grep -oE 'activationRequestSDKTag[[:space:]]+= "go/[0-9]+\.[0-9]+\.[0-9]+"' offline.go | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$TAG" != "$GOT" ]; then
            echo "Tag v$TAG does not match activationRequestSDKTag go/$GOT"
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
      - name: Warm the Go module proxy
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          curl "https://proxy.golang.org/github.com/!auth!forge!c!c/authforge-go/@v/${TAG}.info"
